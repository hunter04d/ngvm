[package]
name = "ngvm"
version = "0.1.0"
authors = ["hunter04d <hunter04d@gmail.com>"]
edition = "2024"

default-run = "main"
[profile.release]
lto = true

[dependencies]
num-traits = "0.2.19"
num-derive = "0.5.1"
thiserror = "2.0.21"
smallvec = "1.16.3"
arrayvec = "0.7.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
postcard = { version = "1.1.3", features = ["use-std"] }
flate2 = "1.1.10"

[dev-dependencies]
pretty_assertions = "1.4.1"
